<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>常見疑問｜Border Comfy 舒適邊境</title>
  <meta name="description" content="Border Comfy 舒適邊境露營枕常見疑問解答。"/>
  <link rel="icon" href="assets/ba616a_172e85f8b3554c9199c259f172bafbea_mv2.png"/>
  <style>
    @font-face {
      font-family: 'futura-lt-w01-book';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/futura-lt-w01-book.woff2') format('woff2');
    }
    @font-face {
      font-family: 'futura-lt-w01-light';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/futura-lt-w05-light.woff2') format('woff2'),
           url('fonts/futura-lt-w01-light.woff2') format('woff2');
    }
    @font-face {
      font-family: 'helvetica-w01-roman';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/helvetica-w02-roman.woff2') format('woff2'),
           url('fonts/helvetica-w01-roman.woff2') format('woff2');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #1a1210;
      color: #fff;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* ===== HOME BUTTON ===== */
    .home-btn {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 100;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      border-radius: 50%;
      transition: background 0.2s;
    }
    .home-btn:hover { background: rgba(0,0,0,0.6); }
    .home-btn svg { width: 22px; height: 22px; fill: rgba(255,255,255,0.85); }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      background-image: url('assets/11062b_febd8241082647cd9fa37e2eda26beaf_mv2.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.42);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 24px 40px;
      max-width: 720px;
      width: 100%;
    }
    .hero-content .label {
      font-family: 'futura-lt-w01-light', sans-serif;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #D0AC68;
      margin-bottom: 12px;
    }
    .hero-content h1 {
      font-family: 'futura-lt-w01-book', Helvetica, sans-serif;
      font-size: clamp(36px, 7vw, 64px);
      color: #fff;
      text-shadow: 0 4px 5px rgba(0,0,0,0.4);
      margin-bottom: 16px;
    }
    .hero-content .subtitle {
      font-size: clamp(15px, 2vw, 18px);
      color: rgba(255,255,255,0.80);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      line-height: 1.8;
      margin-bottom: 48px;
    }

    /* ===== FORM ===== */
    .form-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 36px 32px;
      text-align: left;
    }
    .form-card h2 {
      font-family: 'futura-lt-w01-book', sans-serif;
      font-size: 18px;
      color: #D0AC68;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 6px;
      color: #fff;
      font-family: 'helvetica-w01-roman', Helvetica, sans-serif;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #D0AC68;
    }
    .form-group textarea { min-height: 110px; resize: vertical; }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #D0AC68;
      color: #272120;
      font-family: 'futura-lt-w01-book', sans-serif;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #b8944f; transform: translateY(-2px); }
    .form-note {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .form-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>

  <!-- 返回首頁 -->
  <a class="home-btn" href="index.html" aria-label="返回首頁">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <section class="hero">
    <div class="hero-content">
      <p class="label">Q &amp; A</p>
      <h1>常見疑問</h1>
      <p class="subtitle">
        歡迎任何品牌或產品相關提問<br/>
        我們會盡快回覆，並把常被提出的疑問回覆累積在此頁面
      </p>

      <div class="form-card">
        <h2>提出您的問題</h2>
        <form action="https://formspree.io/f/xpwzqgqb" method="POST">
          <div class="form-group">
            <label for="name">您的大名</label>
            <input type="text" id="name" name="name" required/>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required/>
          </div>
          <div class="form-group">
            <label for="phone">Phone（選填）</label>
            <input type="tel" id="phone" name="phone"/>
          </div>
          <div class="form-group">
            <label for="question">您的疑問</label>
            <textarea id="question" name="question" required></textarea>
          </div>
          <button type="submit" class="btn-submit">提出</button>
          <p class="form-note">謝謝您的提問，我們會盡快回覆您！</p>
        </form>
      </div>
    </div>
  </section>

</body>
</html>
